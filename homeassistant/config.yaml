name: FlyBudget Up Preview
version: '0.2.0-up.61'
slug: flybudget_up
description: A private, password-protected budget with native Up Bank transaction imports.
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
init: false
timeout: 30
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: FlyBudget web interface
webui: 'http://[HOST]:[PORT:3001]'
# Supervisor probes the container IP, which may be outside allowed_hosts. The
# TCP watchdog avoids sending an unapproved Host header; Docker's healthcheck
# separately exercises /api/health over loopback inside this container.
watchdog: 'tcp://[HOST]:[PORT:3001]'
ingress: false
backup: cold
# Multi-user mode only: sends password codes as notifications through Home Assistant's
# notify services (docs/MULTI-USER-PLAN.md). The app never reads entities.
homeassistant_api: true
options:
  allowed_hosts: ''
  trust_proxy: false
  multi_user: false
schema:
  allowed_hosts: str
  trust_proxy: bool
  multi_user: bool?
