<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the phone header run up behind the iPhone status bar; pages pad
         themselves with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Allotment" />
    <!-- The header colour; utils/applyTheme.ts keeps it in step with the theme -->
    <meta name="theme-color" content="#f7f5ef" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Allotment</title>
    <!-- Tells the Mac desktop app this page draws its own drag strips, so a server window can
         drop the title bar (electron/macWindow.ts). Keep it in the <head>. -->
    <meta name="flybudget-mac-window" content="drag-strips" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
