name: Release

# Pushing a version tag like v1.0.0 builds the desktop app for Windows, macOS and Linux,
# checks that each one starts, signs every file with Sigstore (keyless, via GitHub OIDC)
# with SLSA build provenance, and publishes them together as a GitHub release. Tags with a
# suffix (e.g. v1.1.0-beta.1) are marked as betas ("pre-release" on GitHub).
#
# Publish tested main dispatches this workflow on a tag after successful main CI.
# Manual runs on a branch and PRs only validate packaging; a dispatch on a tested version
# tag publishes, including recovery of a failed release. No custom PAT is required.
#
# File names don't include the version, so the website can link to
# releases/latest/download/<file> (see website/src/pages/download.tsx):
#   Allotment-Windows-Setup.exe
#   Allotment-macOS-arm64.dmg, Allotment-macOS-x64.dmg
#   Allotment-Linux-x86_64.AppImage, Allotment-Linux-arm64.AppImage
#   Allotment-Linux-amd64.deb, Allotment-Linux-arm64.deb
#
# Verify a download with:
#   gh attestation verify Allotment-Windows-Setup.exe -R tvrooi/Allotment

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electron-builder.json
      - electron-builder.release.cjs
      - electron/**
      - homeassistant/**
      - scripts/**
      - Dockerfile

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require matching version and green main CI for published releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          git fetch origin main --depth=100
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "CI passed" and .conclusion == "success") | .id' > /tmp/passed
          test -s /tmp/passed

  build:
    needs: verify
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            files: |
              dist-electron/*.exe
              dist-electron/*.blockmap
              dist-electron/*-win.yml
              dist-electron/up.yml
            app: dist-electron/win-unpacked/Allotment.exe
          - os: macos-latest # Apple Silicon; builds the Intel version too
            name: macos
            files: |
              dist-electron/*.dmg
              dist-electron/*.zip
              dist-electron/*.blockmap
              dist-electron/up-mac.yml
            app: dist-electron/mac-arm64/Allotment.app/Contents/MacOS/Allotment
          - os: ubuntu-latest
            name: linux
            files: |
              dist-electron/*.AppImage
              dist-electron/*.deb
              dist-electron/up*.yml
            app: dist-electron/linux-unpacked/flybudget
    runs-on: ${{ matrix.os }}
    env:
      FLYBUDGET_MAC_SIGNING: ${{ matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/v') && (secrets.CSC_LINK != '' || vars.MAC_SIGNING_REQUIRED == 'true') && 'true' || 'false' }}
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 like CI: Node 22's npm 10 can't verify newer package attestations
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server

      - name: Build the app
        run: npm run electron:build -- --publish never
        env:
          # Signing is optional until the owner configures Developer ID. Once configured (or
          # MAC_SIGNING_REQUIRED is set), missing inputs fail closed. PRs receive no secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.FLYBUDGET_MAC_SIGNING }}
          CSC_FOR_PULL_REQUEST: 'true' # Ad-hoc validation only; PRs receive no signing secrets.
          CSC_LINK: ${{ matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/v') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/v') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}

      - name: Verify signed and notarized Mac release
        if: env.FLYBUDGET_MAC_SIGNING == 'true'
        run: |
          set -euo pipefail
          for app in dist-electron/mac*/Allotment.app; do
            codesign --verify --deep --strict "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            xcrun stapler validate "$app"
          done

      # Start the packaged app and wait for its built-in server to answer, so a release can't
      # ship an app that doesn't start (a missing native module, a broken fuse or asar).
      - name: Allow Electron's sandbox on the Linux runner
        if: matrix.name == 'linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
        # Installing the .deb sets up the sandbox helper instead (see the install guide).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Choose local mode in a fresh CI-only profile
        run: node scripts/prepare-packaged-smoke.cjs

      - name: Check that the app starts
        shell: bash
        env:
          APP: ${{ matrix.app }}
          RUN: ${{ matrix.name == 'linux' && 'xvfb-run -a' || '' }}
        run: |
          $RUN "$APP" > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:58342/api/health | grep -q '"ok"'; then
              echo "Allotment started"
              exit 0
            fi
            sleep 2
          done
          echo "Allotment didn't start within two minutes:"
          cat app.log
          exit 1
      - name: Stop the app
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) taskkill //F //IM Allotment.exe || true ;;
            macOS) pkill -f Allotment.app || true ;;
            Linux) pkill -f linux-unpacked/flybudget || true ;;
          esac

      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}

      # Ship the signed attestation next to each file: the full Sigstore bundle
      # (.sigstore.json) and its DSSE-signed in-toto provenance (.intoto.jsonl).
      - name: Write signature and provenance files
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for file in dist-electron/*.exe dist-electron/*.dmg dist-electron/*.zip dist-electron/*.blockmap dist-electron/up*.yml dist-electron/*.AppImage dist-electron/*.deb; do
            [ -f "$file" ] || continue
            cp "$BUNDLE" "$file.sigstore.json"
            node -e "const b=require(process.argv[1]); process.stdout.write(JSON.stringify(b.dsseEnvelope)+'\n')" "$BUNDLE" > "$file.intoto.jsonl"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            dist-electron/*.sigstore.json
            dist-electron/*.intoto.jsonl
          if-no-files-found: error
          retention-days: 14

  homeassistant:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --test homeassistant/ha-launch.test.cjs
      - run: python3 -m unittest discover -s scripts
      - run: python3 homeassistant/package.py --out /tmp/flybudget-ha
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: /tmp/flybudget-ha/flybudget_up
          load: true
          tags: flybudget-ha:test
          cache-from: type=gha,scope=ha
          cache-to: type=gha,scope=ha,mode=max
      - run: node homeassistant/smoke-test.cjs flybudget-ha:test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish tested HA image for both supported architectures
        id: image
        if: startsWith(github.ref, 'refs/tags/v')
        # Normally ~3 minutes; a stalled multi-arch push otherwise hangs for the 6-hour job limit.
        # Recover with a re-run of Release on the same tested tag.
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: /tmp/flybudget-ha/flybudget_up
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tvrooi/flybudget-ha:${{ steps.version.outputs.value }}
          no-cache: true
          labels: |
            org.opencontainers.image.source=https://github.com/tvrooi/Allotment
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true
      - name: Export catalog only after successful image publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/export-ha-catalog.py --out release-output/home-assistant-app.zip --commit "$GITHUB_SHA" --digest "$DIGEST"
      - name: Attest catalog bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-output/home-assistant-app.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: app-homeassistant
          path: release-output/home-assistant-app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, homeassistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          path: release
          merge-multiple: true

      # One file with every download's SHA-256, for people who check downloads that way
      - name: Write checksums
        working-directory: release
        run: sha256sum Allotment-* *.yml home-assistant-app.zip | grep -v -e '\.sigstore\.json' -e '\.intoto\.jsonl' > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "Allotment $TAG")
          # v1.0.0 → normal release; tags with a suffix (v1.1.0-beta.1) → marked as a beta
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
